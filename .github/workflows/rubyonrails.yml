name: "Rails CI"
on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build_test_lint_audit:
    strategy:
      matrix:
        ruby-version:
          - "3.3"
          - "3.4"
          - "4.0"
        rails-version:
          - "7.2"
          - "8.0"
          - "8.1"
    name: ${{ format('Tests (Ruby {0}, Rails {1})', matrix.ruby-version, matrix.rails-version) }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.rails-version }}.gemfile
      RAILS_ENV: test
      SKIP_COV: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
      - run: npm ci

      - name: Install Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Install image processors
        run: sudo apt-get update && sudo apt-get install -y imagemagick libvips-dev

      - name: Update CMS gem
        run: bundle update comfy_middle_seat

      - name: Compile assets
        run: bin/bundle exec rails comfy:compile_assets

      - name: Run tests
        run: |
          bin/bundle exec rails db:drop
          bin/bundle exec rails db:create
          bin/bundle exec rails db:migrate
          bin/bundle exec rake test

      - name: Lint the code
        run: bin/bundle exec rubocop --parallel

      - name: Audit application security
        run: bin/bundle exec brakeman -q -w3

      - name: Audit dependencies
        id: dependency_audit
        # Retain Rails 7.2 compatibility tests while its dependency findings remain visible.
        # Restore a required audit when patched dependencies are available.
        continue-on-error: ${{ matrix.rails-version == '7.2' }}
        run: bin/bundle exec bundler-audit --update --gemfile-lock gemfiles/${{ matrix.rails-version }}.gemfile.lock

      - name: Report Rails 7.2 dependency audit failure
        if: ${{ matrix.rails-version == '7.2' && steps.dependency_audit.outcome == 'failure' }}
        run: |
          echo "::warning title=Rails 7.2 dependency audit::Dependency audit did not pass. Rails 7.2 compatibility checks remain required; review the audit output and use patched Rails dependencies in production."
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Rails 7.2 dependency audit did not pass

          Rails 7.2 remains compatibility-tested, but its dependency audit is temporarily advisory-only because security findings currently have no patched 7.2 release. Review the audit output for findings or execution errors; a passing job does not mean these dependencies are secure.

          Tests, lint, and Brakeman remain required. Dependency audits remain required on Rails 8.0 and 8.1. Restore a required Rails 7.2 audit when patched dependencies are available.
          SUMMARY

  system_tests:
    name: System tests (Ruby 4.0, Rails 8.1)
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/8.1.gemfile
      RAILS_ENV: test
      SKIP_COV: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
      - run: npm ci

      - name: Install Ruby 4.0
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Compile assets
        run: npm run build && npm run build:css

      - name: Prepare database
        run: bin/bundle exec rails db:prepare

      - name: Run system tests
        run: bin/bundle exec rake test:system
